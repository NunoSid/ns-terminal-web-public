services:
  ns-terminal:
    build: .
    image: ns-terminal-web:local
    container_name: ns-terminal-web
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    env_file: .env
    environment:
      PORT: "8787"
      WEB_ROOT: /app/web
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
networks:
  coolify:
    external: true
